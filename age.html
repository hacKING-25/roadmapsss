
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
</head>
<body>

    <h1>Age Calculator</h1>

    <label for="dob">Enter your date of birth:</label>
    <input type="date" id="dob">

    <button onclick="calculateAge()">Calculate Age</button>

    <h2 id="result"></h2>

    <script type="module">
        import { DateTime } from
        "https://cdn.jsdelivr.net/npm/luxon@3/build/es6/luxon.min.js";

        window.calculateAge = function () {

            const dob = document.getElementById("dob").value;
            const result = document.getElementById("result");

            if (!dob) {
                result.innerText = "Please select your birth date";
                return;
            }

            const birthDate = DateTime.fromISO(dob);
            const today = DateTime.now().startOf("day");

            if (!birthDate.isValid) {
                result.innerText = "Invalid date";
                return;
            }

            if (birthDate > today) {
                result.innerText = "Date cannot be in the future";
                return;
            }

            const age = today.diff(birthDate, [
                "years",
                "months",
                "days"
            ]).toObject();

            result.innerText =
                `Your age is ${age.years} years,
                ${age.months} months and ${age.days} days.`;
        };
    </script>

</body>
</html>
